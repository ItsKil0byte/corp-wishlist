spring:
  application:
    name: corp-wishlist

  profiles:
    default: dev

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET}

app:
  storage:
    path: ${UPLOAD_DIR:./uploads}
    allowed-extensions: jpg,jpeg,png,webp
    max-size-mb: 5

telegram:
  bot_token: ${BOT_TOKEN}

management:
  endpoints:
    web:
      exposure:
        # Эндпоинты для prometheus
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
