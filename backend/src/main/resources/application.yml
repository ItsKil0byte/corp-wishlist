spring:
    application:
        name: corp-wishlist

    profiles:
        default: dev

    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        baseline-version: 1
        validate-on-migrate: true
        clean-disabled: true

jwt:
    secret: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=" #Тестовый ключ, TODO() заменить в дальнейшем на нормальный

app:
    storage:
        path: ${UPLOAD_DIR:./uploads}
        allowed-extensions: jpg,jpeg,png,webp
        max-size-mb: 5
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

telegram:
    bot_token: ${BOT_TOKEN}

management:
    endpoints:
        web:
            exposure:
                # Эндпоинты для prometheus
                include: health, info, prometheus
    metrics:
        tags:
            application: ${spring.application.name}
