services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: wishlist
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: pass
        ports:
            - "5432:5432"
        volumes:
            - data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d wishlist"]
            interval: 5s
            timeout: 3s
            retries: 5

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: wishlist
            DB_USER: postgres
            DB_PASSWORD: pass
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "8080:8080"

    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "5050:80"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./misc/pgadmin.json:/pgadmin4/servers.json

volumes:
    data:
