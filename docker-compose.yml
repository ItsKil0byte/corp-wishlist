services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          VITE_API_URL: ${API_URL}
      ports:
        - "3000:80"
      restart: unless-stopped

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            SPRING_PROFILES_ACTIVE: postgres
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "8080:8080"
        restart: unless-stopped

    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        ports:
            - "5050:80"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./misc/pgadmin.json:/pgadmin4/servers.json
        restart: unless-stopped

    cloudpub:
      image: cloudpub/cloudpub:latest
      network_mode: host
      environment:
        TOKEN: пупупу
        HTTP: 8080, 3000
      command: run
      restart: unless-stopped
      volumes:
        - cloudpub-config:/home/cloudpub
      depends_on:
        - frontend
        - backend


volumes:
    data:
    cloudpub-config:
